<!doctype html>
<html><head><meta charset="utf-8"><base href="../../"><title>Character bench</title>
<style>html,body{margin:0;background:#555;overflow:hidden}</style>
<script type="importmap">{"imports":{"three":"./vendor/three/build/three.module.js","three/addons/":"./vendor/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
// Dev bench: renders character configs under neutral light (tools/dev/chars.html?set=...)
import * as THREE from 'three';
import { Assets } from './src/engine/assets.js';
import { human } from './src/world/humans.js';
import { heroProp, heroDefs } from './src/world/hero.js';
const r = new THREE.WebGLRenderer({ antialias: true });
r.setSize(innerWidth, innerHeight); r.shadowMap.enabled = true; r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x6a6e78);
const pm = new THREE.PMREMGenerator(r);
const es = new THREE.Scene(); es.background = new THREE.Color(0x9098a8); scene.environment = pm.fromScene(es).texture; scene.environmentIntensity = 0.5;
const sun = new THREE.DirectionalLight(0xfff2e0, 2.2); sun.position.set(3, 6, 5); sun.castShadow = true; sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02; sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6; sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -2; scene.add(sun);
scene.add(new THREE.HemisphereLight(0xb0c0ff, 0x403830, 0.8));
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x4a4a4a })); ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 100);
const assets = new Assets(r);
const ctx = { assets, groundAt: () => 0 };
window.bench = { THREE, scene, cam, r, human, ctx, ups: [] };
window.spawn = async (list, { gap = 1.1, dist = 7, y = 1.0, yaw = 0, t = 1.0 } = {}) => {
  for (const [i, o] of list.entries()) {
    const res = await human(ctx, o);
    res.object.position.set((i - (list.length - 1) / 2) * gap, 0, 0);
    res.object.rotation.y = yaw;
    scene.add(res.object);
    window.bench.ups.push(res.update);
  }
  cam.position.set(0, y + 0.3, dist); cam.lookAt(0, y, 0);
  for (const u of window.bench.ups) u(t);
  r.render(scene, cam);
  return 'ok';
};
window.spawnHero = async (names, { gap = 2.2, dist = 12, y = 1.0 } = {}) => {
  const defs = await heroDefs();
  for (const [i, n] of names.entries()) {
    const res = await heroProp(ctx, { hero: n }, defs[n]);
    res.object.position.set((i - (names.length - 1) / 2) * gap, 0, 0);
    scene.add(res.object);
  }
  cam.position.set(0, y + 0.6, dist); cam.lookAt(0, y, 0);
  r.render(scene, cam);
  return 'ok';
};
window.ready = true;
</script></body></html>
